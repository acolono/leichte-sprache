#     - tags
#   when: manual
#   environment:
#     name: pypi
#     url: https://pypi.org/project/leichte-sprache-rulez/

# Docker Job - Build and push Docker image to GitLab Container Registry
docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - main
    - master
    - tags

# Notes:
# 1. Tests require spaCy model (~500MB) - consider caching
# 2. Adjust 'only' rules based on your branching strategy
# 3. Set TWINE_USERNAME and TWINE_PASSWORD as CI/CD variables for PyPI deployment

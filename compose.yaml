services:
  api:
    build:
      context: .
      # Build-time secret for scripts/download_models.py (private models release).
      # Declared here so `docker compose build` (and the implicit build inside
      # `docker compose up`) can mount $GITHUB_TOKEN without falling back to the
      # anonymous-fetch path. Equivalent to:
      #   DOCKER_BUILDKIT=1 docker build --secret id=github_token,env=GITHUB_TOKEN .
      secrets:
        - github_token
    # Pin the image tag so a manual `docker build -t leichte-sprache-rulez-api:latest .`
    # is reused by compose, and so subsequent ups don't silently rebuild without
    # the secret (which would drop the 4 ML model files).
    image: leichte-sprache-rulez-api:latest
    ports:
      # When running with `--profile traefik` in production, you usually
      # want to drop this host binding (or change it to "127.0.0.1:8000:8000")
      # so the API is reachable only via TLS through Traefik. Left as a
      # broad bind here to keep local development friction-free.
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Point at the in-network Ollama service when the `ollama` profile is up.
      # Harmless when the profile is off — requests with provider=ollama will
      # simply fail with a connection error instead of being silently misrouted.
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_HOST: http://ollama:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      # 120s gives the first /analyse request enough headroom to lazy-load the
      # 4 ML models (~1.1 GB combined) on slow disks without flapping unhealthy.
      start_period: 120s
      retries: 3
    # Traefik routing metadata. Active only when the `traefik` service is
    # running (`docker compose --profile traefik up`). Labels are inert
    # otherwise — Docker ignores them when no provider reads them.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${TRAEFIK_DOMAIN:-api.localhost}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    # Not published to host by default — avoids conflict with a locally
    # installed Ollama. Add a `ports:` entry yourself if you want host access.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Optional reverse proxy with TLS termination via Let's Encrypt.
  # Enable with:
  #   docker compose --profile traefik up -d
  # Prerequisites (in .env):
  #   TRAEFIK_DOMAIN       — public FQDN whose A/AAAA record points at this host
  #   TRAEFIK_ACME_EMAIL   — contact email for Let's Encrypt
  # Plus host ports 80 + 443 must be publicly reachable so Let's Encrypt's
  # HTTP-01 challenge can hit the host.
  traefik:
    image: traefik:v3.5
    profiles: ["traefik"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only docker socket so Traefik can discover containers by their
      # labels. Read-only is critical — anything with write access to the
      # docker socket has root on the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Persistent ACME state. Without this, certs are re-issued on every
      # restart and you hit Let's Encrypt rate limits (50 certs / week / domain).
      - traefik-acme:/letsencrypt
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # While testing, switch to the staging CA to avoid burning prod rate
      # limits. Certs will be untrusted by browsers — that's expected.
      # Uncomment the next line:
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # One-shot model warmer. Pulls the default Ollama model on first `up`,
  # then exits. Subsequent ups are a no-op because the model is cached in
  # the ollama-data volume.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-mistral-nemo:12b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if ollama list | awk 'NR>1 {print $$1}' | grep -qx "$$OLLAMA_DEFAULT_MODEL"; then
          echo "model $$OLLAMA_DEFAULT_MODEL already present, skipping pull"
        else
          echo "pulling $$OLLAMA_DEFAULT_MODEL"
          ollama pull "$$OLLAMA_DEFAULT_MODEL"
        fi
    restart: "no"

volumes:
  ollama-data:
  traefik-acme:

secrets:
  # Build-time GitHub token used by scripts/download_models.py to fetch the
  # private models release. Sourced from the host's $GITHUB_TOKEN env var
  # (set via `export GITHUB_TOKEN=$(gh auth token)` before `docker compose
  # build`). Compose v2.23+ supports `environment:` for build secrets;
  # users on older Compose can swap this to `file: ./.github-token` and
  # write the token to that file (gitignored) instead.
  github_token:
    environment: GITHUB_TOKEN
